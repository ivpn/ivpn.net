serversSummary = "Bare-metal servers in 41 countries. IVPN runs <strong>89 gateways</strong> across <strong>58 locations</strong>, hosted with <strong>17 datacenter partners</strong>. Every server is a physical machine, with no virtual locations. WireGuard and OpenVPN are available on every server."
