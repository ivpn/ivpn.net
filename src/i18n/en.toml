serversFaqStreamingQ = "Can I use IVPN servers for accessing streaming services?"
serversFaqStreamingA = "IVPN does not run dedicated streaming servers and does not optimise the network for unblocking streaming platforms. Some services work over the VPN and some do not, and results change as platforms update their blocking. See <a href=\"/knowledgebase/general/can-i-access-hulu-or-netflix-or-bbc-iplayer-using-ivpn/\">Can I access Netflix, Hulu or BBC iPlayer using IVPN?</a>"
serversFaqBlockedQ = "Can I connect from a network that blocks VPNs?"
serversFaqBlockedA = "Yes. The IVPN apps include V2Ray obfuscation (VMess over QUIC or TCP) on every platform, plus obfs4 for OpenVPN on desktop. These disguise VPN traffic so it can pass through networks that block VPNs. We can\u2019t guarantee connectivity on every network: networks behave differently and blocking techniques change over time. See <a href=\"/blog/v2ray-obfuscation-available-all-ivpn-platforms/\">V2Ray obfuscation on all IVPN platforms</a> and <a href=\"/knowledgebase/troubleshooting/i-cannot-connect-from-china-or-vietnam-or-iran-or-russia-etc-what-can-i-do/\">connecting from China, Iran, Russia and similar networks</a>."
serversFaqSocksQ = "Does IVPN support SOCKS5?"
serversFaqSocksA = "Yes. IVPN offers a SOCKS5 proxy for app-based tunnelling. See <a href=\"/blog/socks5-proxies-app-based-vpn-tunnels/\">SOCKS5 proxies and app-based VPN tunnels</a> and the <a href=\"/knowledgebase/general/socks5-proxy-service/\">SOCKS5 proxy service guide</a>."
serversFaqProtocolsQ = "What protocols are available on IVPN servers?"
serversFaqProtocolsA = "WireGuard and OpenVPN, available on every server. WireGuard connections are quantum resistant by default in the IVPN apps, using a post-quantum key exchange. See <a href=\"/blog/quantum-resistant-wireguard-connections-ivpn-apps/\">quantum-resistant WireGuard connections</a>."
serversFaqBareMetalQ = "What is bare metal, and how are IVPN\u2019s servers set up?"
serversFaqBareMetalA = "Every IVPN gateway is a bare-metal server: dedicated physical hardware rented from a datacenter partner, not a virtualised instance and not a virtual location. Servers use LUKS full-disk encryption, mandatory access controls, and firewalled IPMI. A small number of pilot gateways also run a RAM-only (diskless) architecture, extending it across the network is an ongoing project."
